name: Build fxlink for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-libusb
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-ncurses
          mingw-w64-x86_64-zlib

    - name: Apply Win32 UI Modifications
      run: |
        cd fxsdk

        # 1. Create win32_ui.c
        cat << 'EOF' > fxlink/modes/win32_ui.c
        #ifdef _WIN32
        #include <windows.h>
        #include <commctrl.h>
        #include "../fxlink.h"
        #include <fxlink/filter.h>
        #include <fxlink/logging.h>
        #include <fxlink/protocol.h>
        #include <fxlink/devices.h>
        #include <stdio.h>
        #include <stdlib.h>

        static HWND hMainWnd;
        static HWND hListBox;
        static HWND hEdit;
        static HWND hBtnSend;
        static libusb_context *usb_ctx;
        static struct fxlink_device_list devices;

        static void append_log(const char *str) {
            if (!hListBox) return;
            char *copy = strdup(str);
            char *token = strtok(copy, "\n");
            while(token) {
                SendMessageA(hListBox, LB_ADDSTRING, 0, (LPARAM)token);
                SendMessageA(hListBox, WM_VSCROLL, SB_BOTTOM, 0);
                token = strtok(NULL, "\n");
            }
            free(copy);
        }

        static void log_handler(int display_fmt, char const *str) {
            (void)display_fmt;
            append_log(str);
        }

        static void execute_command(const char *cmd) {
            if(strncmp(cmd, "/echo ", 6) == 0) {
                const char *payload = cmd + 6;
                int len = strlen(payload);
                char *out = malloc(len + 6);
                sprintf(out, "echo %s\n", payload);
                for(int i = 0; i < devices.count; i++) {
                    struct fxlink_device *fdev = &devices.devices[i];
                    if(fdev->status == FXLINK_FDEV_STATUS_CONNECTED) {
                        fxlink_device_start_bulk_OUT(fdev, "fxlink", "command", out, strlen(out), true);
                    }
                }
            } else {
                append_log("Unknown command. Only /echo is supported in this minimal UI.");
            }
        }

        static LRESULT CALLBACK WindowProc(HWND hwnd, UINT uMsg, WPARAM wParam, LPARAM lParam) {
            switch (uMsg) {
                case WM_CREATE: {
                    HFONT hFont = (HFONT)GetStockObject(DEFAULT_GUI_FONT);
                    hListBox = CreateWindowExA(WS_EX_CLIENTEDGE, "LISTBOX", "",
                        WS_CHILD | WS_VISIBLE | WS_VSCROLL | LBS_NOINTEGRALHEIGHT,
                        10, 10, 560, 300, hwnd, (HMENU)1, GetModuleHandle(NULL), NULL);
                    SendMessage(hListBox, WM_SETFONT, (WPARAM)hFont, TRUE);
                    hEdit = CreateWindowExA(WS_EX_CLIENTEDGE, "EDIT", "",
                        WS_CHILD | WS_VISIBLE | ES_AUTOHSCROLL,
                        10, 320, 470, 25, hwnd, (HMENU)2, GetModuleHandle(NULL), NULL);
                    SendMessage(hEdit, WM_SETFONT, (WPARAM)hFont, TRUE);
                    hBtnSend = CreateWindowExA(0, "BUTTON", "Send",
                        WS_CHILD | WS_VISIBLE | BS_PUSHBUTTON,
                        490, 320, 80, 25, hwnd, (HMENU)3, GetModuleHandle(NULL), NULL);
                    SendMessage(hBtnSend, WM_SETFONT, (WPARAM)hFont, TRUE);
                    SetTimer(hwnd, 1, 50, NULL);
                    return 0;
                }
                case WM_TIMER: {
                    if (wParam == 1 && usb_ctx) {
                        struct timeval zero_tv = { 0 };
                        libusb_handle_events_timeout(usb_ctx, &zero_tv);
                        fxlink_device_list_refresh(&devices);
                        for(int i = 0; i < devices.count; i++) {
                            struct fxlink_device *fdev = &devices.devices[i];
                            if(fxlink_device_ready_to_connect(fdev) && fxlink_device_has_fxlink_interface(fdev)) {
                                if(fxlink_device_claim_fxlink(fdev)) {
                                    append_log("Connected to calculator.");
                                    fxlink_device_start_bulk_IN(fdev);
                                }
                            }
                            struct fxlink_message *msg;
                            while((msg = fxlink_device_finish_bulk_IN(fdev))) {
                                char buf[256];
                                sprintf(buf, "[RX] %.16s:%.16s (%d bytes)", msg->application, msg->type, msg->size);
                                append_log(buf);
                                if(strncmp(msg->application, "fxlink", 6) == 0 && strncmp(msg->type, "text", 4) == 0) {
                                    char *txt = malloc(msg->size + 1);
                                    memcpy(txt, msg->data, msg->size);
                                    txt[msg->size] = 0;
                                    append_log(txt);
                                    free(txt);
                                }
                                fxlink_message_free(msg, true);
                                fxlink_device_start_bulk_IN(fdev);
                            }
                        }
                    }
                    return 0;
                }
                case WM_COMMAND: {
                    if (LOWORD(wParam) == 3 || (LOWORD(wParam) == 2 && HIWORD(wParam) == EN_MAXTEXT)) {
                        if (LOWORD(wParam) == 3) {
                            char buf[256];
                            GetWindowTextA(hEdit, buf, 256);
                            execute_command(buf);
                            SetWindowTextA(hEdit, "");
                        }
                    }
                    return 0;
                }
                case WM_DESTROY:
                    KillTimer(hwnd, 1);
                    PostQuitMessage(0);
                    return 0;
            }
            return DefWindowProc(hwnd, uMsg, wParam, lParam);
        }

        int main_win32_interactive(libusb_context *ctx) {
            usb_ctx = ctx;
            fxlink_log_set_handler(log_handler);
            fxlink_device_list_track(&devices, ctx);
            HINSTANCE hInstance = GetModuleHandle(NULL);
            const char CLASS_NAME[] = "FxlinkWin32Class";
            WNDCLASSA wc = {0};
            wc.lpfnWndProc = WindowProc;
            wc.hInstance = hInstance;
            wc.lpszClassName = CLASS_NAME;
            wc.hbrBackground = (HBRUSH)(COLOR_WINDOW+1);
            wc.hCursor = LoadCursor(NULL, IDC_ARROW);
            RegisterClassA(&wc);
            hMainWnd = CreateWindowExA(0, CLASS_NAME, "fxlink - Windows UI",
                WS_OVERLAPPEDWINDOW & ~WS_THICKFRAME & ~WS_MAXIMIZEBOX,
                CW_USEDEFAULT, CW_USEDEFAULT, 600, 400, NULL, NULL, hInstance, NULL);
            if (hMainWnd == NULL) return 0;
            ShowWindow(hMainWnd, SW_SHOW);
            append_log("fxlink Windows UI started. Waiting for connection...");
            MSG msg;
            while (GetMessage(&msg, NULL, 0, 0)) {
                TranslateMessage(&msg);
                DispatchMessage(&msg);
            }
            fxlink_device_list_stop(&devices);
            fxlink_log_set_handler(NULL);
            return 0;
        }
        #endif
        EOF

        # 2. Patch fxlink.h by appending
        echo "int main_win32_interactive(libusb_context *context);" >> fxlink/fxlink.h

        # 3. Patch main.c
        # Replace the `else if(mode == 't') {` block
        awk '
        /else if\(mode == '\'t\''\) \{/ {
            print "	else if(mode == '\'t\'') {"
            print "#ifdef _WIN32"
            print "		rc = main_win32_interactive(context);"
            print "#else"
            print "#ifndef FXLINK_DISABLE_POLL"
            print "		rc = main_tui_interactive(context);"
            print "#endif"
            print "#endif"
            skip = 1
            next
        }
        skip && /}/ {
            print "	}"
            skip = 0
            next
        }
        skip { next }
        { print }
        ' fxlink/main.c > fxlink/main.c.tmp
        mv fxlink/main.c.tmp fxlink/main.c

        # 4. Patch CMakeLists.txt to conditionally compile win32_ui.c and link user32/gdi32
        awk '
        /fxlink\/tui\/tui-interactive.c/ {
            print "  fxlink/tui/tui-interactive.c)"
            print "if(WIN32)"
            print "  target_sources(fxlink PRIVATE fxlink/modes/win32_ui.c)"
            print "  target_link_libraries(fxlink user32 gdi32 comdlg32)"
            print "endif()"
            next
        }
        { print }
        ' CMakeLists.txt > CMakeLists.txt.tmp
        mv CMakeLists.txt.tmp CMakeLists.txt

    - name: Configure CMake (Static)
      run: |
        cd fxsdk
        cmake -B build-static -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DFXLINK_DISABLE_UDISKS2=ON \
          -DFXLINK_DISABLE_SDL2=ON \
          -DFXLINK_DISABLE_POLL=ON \
          -DFXLINK_DISABLE_ANSIESC=OFF \
          -DCMAKE_INSTALL_PREFIX=install-static

    - name: Build (Static)
      run: |
        cd fxsdk
        cmake --build build-static

    - name: Configure CMake (Shared)
      run: |
        cd fxsdk
        # Patch CMakeLists.txt to allow building shared library
        sed -i 's/add_library(libfxlink STATIC/add_library(libfxlink/g' CMakeLists.txt
        cmake -B build-shared -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DFXLINK_DISABLE_UDISKS2=ON \
          -DFXLINK_DISABLE_SDL2=ON \
          -DFXLINK_DISABLE_POLL=ON \
          -DFXLINK_DISABLE_ANSIESC=OFF \
          -DCMAKE_INSTALL_PREFIX=install-shared

    - name: Build (Shared)
      run: |
        cd fxsdk
        cmake --build build-shared
        cmake --install build-shared

    - name: Gather Artifacts
      run: |
        mkdir -p dist
        # Copy Executable (Static build usually produces exe that still needs DLLs on Windows unless -static flag used, but standard CMake build often dynamic links deps)
        # Actually standard build links against shared libs installed in system.
        cp fxsdk/build-static/fxlink.exe dist/

        # Copy Static Lib
        cp fxsdk/build-static/libfxlink.a dist/

        # Copy Shared Lib (DLL and import lib)
        cp fxsdk/build-shared/libfxlink.dll dist/
        cp fxsdk/build-shared/libfxlink.dll.a dist/

        # Copy Headers
        mkdir -p dist/include
        # Fix: Headers are installed under x86_64-w64-mingw32/include on Windows build
        cp -r fxsdk/install-shared/x86_64-w64-mingw32/include/* dist/include/

        # Copy Dependencies DLLs
        # Using ldd or just copying known ones.
        # libusb-1.0.dll, libpng16-16.dll, libncursesw6.dll, zlib1.dll
        # Also libgcc_s_seh-1.dll, libwinpthread-1.dll usually needed for MinGW apps
        cp /mingw64/bin/libusb-1.0.dll dist/
        cp /mingw64/bin/libpng16-16.dll dist/
        cp /mingw64/bin/libncursesw6.dll dist/
        cp /mingw64/bin/zlib1.dll dist/
        cp /mingw64/bin/libgcc_s_seh-1.dll dist/
        cp /mingw64/bin/libwinpthread-1.dll dist/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fxlink-windows
        path: dist/
